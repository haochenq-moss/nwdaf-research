[project]
name = "nwdaf-research"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "haochenq-moss", email = "haochenqin899@163.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pydantic>=2.9.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.30.0",
]

[project.scripts]
nwdaf-research = "nwdaf_research:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
]
